<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Nuestro Libro de Amor ✨❤️</title>
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Caveat:wght@700&family=Cinzel+Decorative:wght@700&family=Poppins:wght@300;400;600&display=swap');

    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
      user-select: none;
    }

    body {
      width: 100vw;
      height: 100vh;
      overflow: hidden;
      background: radial-gradient(circle at center, #2d0a27 0%, #120314 60%, #050108 100%);
      font-family: 'Poppins', sans-serif;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      color: #fff;
      position: relative;
    }

    #fxCanvas {
      position: absolute;
      inset: 0;
      width: 100%;
      height: 100%;
      pointer-events: none;
      z-index: 30;
    }

    /* Portada de Inicio */
    .cover-screen {
      position: relative;
      z-index: 20;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      text-align: center;
      transition: all 0.8s cubic-bezier(0.22, 1, 0.36, 1);
    }

    .cover-screen.opened {
      opacity: 0;
      transform: scale(1.3);
      pointer-events: none;
      position: absolute;
    }

    .magic-envelope {
      width: 240px;
      height: 300px;
      background: linear-gradient(145deg, #4a0e36 0%, #240519 100%);
      border: 2px solid #ffd700;
      border-radius: 18px;
      box-shadow: 
        0 20px 50px rgba(0, 0, 0, 0.85),
        0 0 35px rgba(255, 75, 130, 0.5),
        inset 0 0 25px rgba(255, 215, 0, 0.2);
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 20px;
      cursor: pointer;
      position: relative;
      transition: transform 0.3s ease;
    }

    .magic-envelope:hover {
      transform: translateY(-6px) scale(1.03);
    }

    .cover-title {
      font-family: 'Cinzel Decorative', cursive;
      font-size: 1.25rem;
      color: #ffd700;
      margin-bottom: 18px;
      text-shadow: 0 0 12px rgba(255, 215, 0, 0.6);
    }

    .wax-seal {
      width: 78px;
      height: 78px;
      border-radius: 50%;
      background: radial-gradient(circle at 30% 30%, #ff4d79, #b3003b);
      border: 3px solid #ffd700;
      box-shadow: 0 0 25px rgba(255, 77, 121, 0.9);
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 2rem;
      animation: heartbeat 1.4s infinite;
    }

    @keyframes heartbeat {
      0%, 100% { transform: scale(1); }
      15% { transform: scale(1.18); }
      30% { transform: scale(1); }
      45% { transform: scale(1.12); }
    }

    .tap-hint {
      margin-top: 20px;
      font-size: 0.78rem;
      letter-spacing: 1.5px;
      text-transform: uppercase;
      color: #ffb3c6;
      animation: pulseOpacity 2s infinite;
    }

    @keyframes pulseOpacity {
      0%, 100% { opacity: 0.5; }
      50% { opacity: 1; }
    }

    /* Interior del Álbum */
    .album-experience {
      position: relative;
      z-index: 15;
      width: 100%;
      height: 100%;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: space-between;
      padding: 14px 12px 18px 12px;
      opacity: 0;
      transform: scale(0.85);
      pointer-events: none;
      transition: all 0.8s cubic-bezier(0.22, 1, 0.36, 1);
    }

    .album-experience.visible {
      opacity: 1;
      transform: scale(1);
      pointer-events: auto;
    }

    .top-bar {
      text-align: center;
    }

    .top-bar h2 {
      font-family: 'Cinzel Decorative', cursive;
      font-size: 1.35rem;
      background: linear-gradient(90deg, #ff9a9e, #ffd700, #ff758c);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
    }

    .top-bar p {
      font-size: 0.74rem;
      color: rgba(255, 230, 240, 0.8);
      letter-spacing: 1px;
      margin-top: 2px;
    }

    /* Carrusel Polaroid 3D */
    .carousel-stage {
      position: relative;
      width: 100%;
      max-width: 650px;
      height: 310px;
      display: flex;
      align-items: center;
      justify-content: center;
      perspective: 1000px;
    }

    .card-slot {
      position: absolute;
      width: 215px;
      background: linear-gradient(180deg, #ffffff 0%, #fff5f8 100%);
      padding: 10px 10px 14px 10px;
      border-radius: 12px;
      border: 2px solid rgba(255, 215, 0, 0.55);
      box-shadow: 
        0 20px 45px rgba(0, 0, 0, 0.7),
        0 0 25px rgba(255, 105, 150, 0.4);
      color: #2b1420;
      text-align: center;
      transition: all 0.5s cubic-bezier(0.22, 1, 0.36, 1);
      cursor: pointer;
    }

    .card-slot.center {
      transform: translateX(0) translateZ(50px) rotateY(0deg) scale(1);
      opacity: 1;
      z-index: 20;
      cursor: default;
    }

    .card-slot.left {
      transform: translateX(-140px) translateZ(-80px) rotateY(25deg) scale(0.78);
      opacity: 0.5;
      z-index: 10;
      filter: blur(1px);
    }

    .card-slot.left:hover { opacity: 0.8; filter: blur(0px); }

    .card-slot.right {
      transform: translateX(140px) translateZ(-80px) rotateY(-25deg) scale(0.78);
      opacity: 0.5;
      z-index: 10;
      filter: blur(1px);
    }

    .card-slot.right:hover { opacity: 0.8; filter: blur(0px); }

    .photo-frame {
      width: 100%;
      height: 185px;
      border-radius: 8px;
      overflow: hidden;
      position: relative;
      background: #240c1d;
    }

    .photo-frame img {
      width: 100%;
      height: 100%;
      object-fit: cover;
      transition: transform 0.5s ease;
    }

    .card-slot.center:hover .photo-frame img {
      transform: scale(1.03);
    }

    .caption-area {
      margin-top: 8px;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 5px;
    }

    .caption-text {
      font-family: 'Caveat', cursive;
      font-size: 1.3rem;
      color: #4a1530;
      line-height: 1.1;
    }

    .edit-caption-btn {
      background: rgba(255, 117, 140, 0.15);
      border: none;
      border-radius: 50%;
      width: 20px;
      height: 20px;
      font-size: 0.65rem;
      cursor: pointer;
      color: #b83b68;
    }

    .card-badge {
      font-size: 0.62rem;
      color: #9e6b82;
      margin-top: 2px;
      letter-spacing: 0.8px;
      text-transform: uppercase;
    }

    /* Panel de controles */
    .glass-dock {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 8px;
      background: rgba(25, 8, 30, 0.75);
      border: 1px solid rgba(255, 182, 193, 0.35);
      padding: 10px 18px;
      border-radius: 22px;
      backdrop-filter: blur(12px);
      box-shadow: 0 8px 25px rgba(0, 0, 0, 0.6);
    }

    .nav-row {
      display: flex;
      align-items: center;
      gap: 16px;
    }

    .arrow-btn {
      width: 32px;
      height: 32px;
      border-radius: 50%;
      border: 1px solid rgba(255, 215, 0, 0.45);
      background: rgba(255, 117, 140, 0.2);
      color: #fff;
      font-size: 0.95rem;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      transition: all 0.25s ease;
    }

    .arrow-btn:hover {
      background: linear-gradient(135deg, #ff758c, #ffb199);
      transform: scale(1.1);
    }

    .vinyl-disc {
      width: 30px;
      height: 30px;
      border-radius: 50%;
      background: radial-gradient(circle, #ff758c 18%, #111 22%, #2a2a2a 45%, #111 65%, #ff758c 95%);
      border: 2px solid #ffd700;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 0.65rem;
      box-shadow: 0 0 10px rgba(255, 215, 0, 0.5);
    }

    .vinyl-disc.spinning {
      animation: spinVinyl 3s linear infinite;
    }

    @keyframes spinVinyl {
      100% { transform: rotate(360deg); }
    }

    .counter-pill {
      font-size: 0.78rem;
      font-weight: 600;
      color: #ffd700;
      letter-spacing: 1px;
    }

    .buttons-row {
      display: flex;
      gap: 6px;
      flex-wrap: wrap;
      justify-content: center;
    }

    .magic-btn {
      background: linear-gradient(135deg, #ff5e8e 0%, #ff9966 100%);
      color: #fff;
      border: none;
      padding: 6px 12px;
      border-radius: 16px;
      font-size: 0.72rem;
      font-weight: 600;
      cursor: pointer;
      box-shadow: 0 3px 12px rgba(255, 94, 142, 0.4);
      transition: all 0.2s ease;
    }

    .magic-btn:hover { transform: translateY(-2px); }

    .magic-btn.outline {
      background: rgba(255, 255, 255, 0.1);
      border: 1px solid rgba(255, 215, 0, 0.45);
      box-shadow: none;
    }

    .magic-btn.outline:hover { background: rgba(255, 215, 0, 0.2); }

    /* Modal de Carta */
    .letter-modal {
      position: fixed;
      inset: 0;
      background: rgba(7, 2, 13, 0.82);
      backdrop-filter: blur(8px);
      z-index: 50;
      display: none;
      align-items: center;
      justify-content: center;
      padding: 20px;
    }

    .letter-modal.open {
      display: flex;
      animation: fadeInModal 0.35s ease;
    }

    @keyframes fadeInModal {
      from { opacity: 0; transform: scale(0.9); }
      to { opacity: 1; transform: scale(1); }
    }

    .letter-paper {
      width: 100%;
      max-width: 330px;
      background: linear-gradient(180deg, #fff9fb 0%, #ffeef4 100%);
      color: #3a1224;
      border-radius: 16px;
      padding: 20px 18px;
      border: 2px solid #ffd700;
      box-shadow: 0 0 40px rgba(255, 94, 142, 0.65);
      text-align: center;
    }

    .letter-paper h2 {
      font-family: 'Cinzel Decorative', cursive;
      font-size: 1.15rem;
      color: #b8295c;
      margin-bottom: 10px;
    }

    .letter-body {
      font-family: 'Caveat', cursive;
      font-size: 1.35rem;
      line-height: 1.3;
      min-height: 110px;
      color: #4a1530;
      margin-bottom: 14px;
    }

    .letter-actions {
      display: flex;
      justify-content: center;
      gap: 8px;
    }

    input[type="file"] { display: none; }

    @media (max-width: 500px) {
      .card-slot { width: 185px; }
      .card-slot.left { transform: translateX(-95px) translateZ(-80px) rotateY(25deg) scale(0.72); }
      .card-slot.right { transform: translateX(95px) translateZ(-80px) rotateY(-25deg) scale(0.72); }
      .photo-frame { height: 160px; }
    }
  </style>
</head>
<body>

  <canvas id="fxCanvas"></canvas>

  <!-- Canción fija de fondo -->
 <audio id="bgMusic" loop>
  <source src="asset/@coldplay   Sparks (Lyrics).m4a" type="audio/mp4">
</audio>

  <!-- 1. PORTADA DE INICIO -->
  <div class="cover-screen" id="coverScreen">
    <div class="magic-envelope" id="openBoxBtn">
      <div class="cover-title">Tengo un regalo para ti</div>
      <div class="wax-seal">❤️</div>
      <div class="tap-hint">Toca el corazón para abrir</div>
    </div>
  </div>

  <!-- 2. ÁLBUM INTERIOR -->
  <div class="album-experience" id="albumExperience">
    <div class="top-bar">
      <h2>Nuestro Libro de Amor</h2>
      <p>✨ Cada instante a tu lado es pura magia ✨</p>
    </div>

    <div class="carousel-stage" id="carouselStage">
      <div class="card-slot left" id="cardLeft">
        <div class="photo-frame"><img id="imgLeft" src="" alt="Anterior"></div>
        <div class="caption-area"><span class="caption-text" id="capLeft"></span></div>
        <div class="card-badge" id="badgeLeft"></div>
      </div>

      <div class="card-slot center" id="cardCenter">
        <div class="photo-frame"><img id="imgCenter" src="" alt="Actual"></div>
        <div class="caption-area">
          <span class="caption-text" id="capCenter"></span>
          <button class="edit-caption-btn" id="editCapBtn" title="Editar frase">✏️</button>
        </div>
        <div class="card-badge" id="badgeCenter"></div>
      </div>

      <div class="card-slot right" id="cardRight">
        <div class="photo-frame"><img id="imgRight" src="" alt="Siguiente"></div>
        <div class="caption-area"><span class="caption-text" id="capRight"></span></div>
        <div class="card-badge" id="badgeRight"></div>
      </div>
    </div>

    <div class="glass-dock">
      <div class="nav-row">
        <button class="arrow-btn" id="prevBtn" title="Anterior">❮</button>
        <div class="vinyl-disc" id="vinylDisc">🎵</div>
        <span class="counter-pill" id="counterPill">1 / 10</span>
        <button class="arrow-btn" id="nextBtn" title="Siguiente">❯</button>
      </div>

      <div class="buttons-row">
        <button class="magic-btn" onclick="document.getElementById('photoInput').click()">📸 Subir fotos</button>
        <button class="magic-btn" id="openLetterBtn">💌 Ver Carta</button>
        <button class="magic-btn outline" id="playBtn">▶️ Música</button>
      </div>
    </div>
  </div>

  <!-- Modal de Carta Secreta -->
  <div class="letter-modal" id="letterModal">
    <div class="letter-paper">
      <h2>Para Ti, Mi Amor ❤️</h2>
      <div class="letter-body" id="letterText"></div>
      <div class="letter-actions">
        <button class="magic-btn outline" style="color:#b8295c; border-color:#b8295c;" id="editLetterBtn">✏️ Editar carta</button>
        <button class="magic-btn" id="closeLetterBtn">Cerrar ✨</button>
      </div>
    </div>
  </div>

  <input type="file" id="photoInput" accept="image/*" multiple>

  <script>
    // Partículas y destellos de corazones
    const canvas = document.getElementById('fxCanvas');
    const ctx = canvas.getContext('2d');
    let w = canvas.width = window.innerWidth;
    let h = canvas.height = window.innerHeight;

    window.addEventListener('resize', () => {
      w = canvas.width = window.innerWidth;
      h = canvas.height = window.innerHeight;
    });

    const particles = [];

    function burstParticles(x, y, count = 25) {
      const icons = ['❤️', '💖', '✨', '💕', '🌹'];
      for (let i = 0; i < count; i++) {
        const angle = Math.random() * Math.PI * 2;
        const speed = 1.5 + Math.random() * 4.5;
        particles.push({
          x, y,
          vx: Math.cos(angle) * speed,
          vy: Math.sin(angle) * speed - 2,
          size: 14 + Math.random() * 12,
          alpha: 1,
          icon: icons[Math.floor(Math.random() * icons.length)]
        });
      }
    }

    function loopFx() {
      ctx.clearRect(0, 0, w, h);
      for (let i = particles.length - 1; i >= 0; i--) {
        const p = particles[i];
        p.x += p.vx;
        p.y += p.vy;
        p.vy += 0.06;
        p.alpha -= 0.015;
        if (p.alpha <= 0) {
          particles.splice(i, 1);
          continue;
        }
        ctx.save();
        ctx.globalAlpha = p.alpha;
        ctx.font = `${p.size}px Arial`;
        ctx.fillText(p.icon, p.x, p.y);
        ctx.restore();
      }
      requestAnimationFrame(loopFx);
    }
    loopFx();

    // Apertura del sobre y música automática
    const coverScreen = document.getElementById('coverScreen');
    const albumExperience = document.getElementById('albumExperience');
    const bgMusic = document.getElementById('bgMusic');
    const playBtn = document.getElementById('playBtn');
    const vinylDisc = document.getElementById('vinylDisc');
    let isPlaying = false;

    document.getElementById('openBoxBtn').addEventListener('click', () => {
      burstParticles(w / 2, h / 2, 40);
      coverScreen.classList.add('opened');
      setTimeout(() => {
        albumExperience.classList.add('visible');
      }, 300);

      bgMusic.play().then(() => {
        playBtn.textContent = '⏸️ Pausar';
        vinylDisc.classList.add('spinning');
        isPlaying = true;
      }).catch(() => {});
    });

    playBtn.addEventListener('click', () => {
      if (isPlaying) {
        bgMusic.pause();
        playBtn.textContent = '▶️ Música';
        vinylDisc.classList.remove('spinning');
        isPlaying = false;
      } else {
        bgMusic.play().then(() => {
          playBtn.textContent = '⏸️ Pausar';
          vinylDisc.classList.add('spinning');
          isPlaying = true;
        }).catch(() => {});
      }
    });

    // Frases del 1 al 10
    const customPhrases = [
      "Mi niño hermoso, te amo ❤️",
      "Mi rey, mi lugar favorito 👑",
      "Contigo todo es magia ✨",
      "Eres mi sueño hecho realidad 💖",
      "Mi persona favorita en el mundo 🥰",
      "Por mil aventuras más juntos 🌹",
      "Tu sonrisa ilumina mis días ☀️",
      "Mi hogar es donde estás tú 🏡",
      "A tu lado soy infinitamente feliz 💘",
      "Te amo hoy, mañana y siempre ♾️"
    ];

    let slides = [
      { src: "https://images.unsplash.com/photo-1518199266791-5375a83190b7?w=500&auto=format&fit=crop&q=80", caption: customPhrases[0] },
      { src: "https://images.unsplash.com/photo-1516589178581-6cd7833ae3b2?w=500&auto=format&fit=crop&q=80", caption: customPhrases[1] },
      { src: "https://images.unsplash.com/photo-1529333166437-7750a6dd5a70?w=500&auto=format&fit=crop&q=80", caption: customPhrases[2] },
      { src: "https://images.unsplash.com/photo-1494774157365-9e04c6720e47?w=500&auto=format&fit=crop&q=80", caption: customPhrases[3] },
      { src: "https://images.unsplash.com/photo-1518199266791-5375a83190b7?w=500&auto=format&fit=crop&q=80", caption: customPhrases[4] },
      { src: "https://images.unsplash.com/photo-1507003211169-0a1dd7228f2d?w=500&auto=format&fit=crop&q=80", caption: customPhrases[5] },
      { src: "https://images.unsplash.com/photo-1500648767791-00dcc994a43e?w=500&auto=format&fit=crop&q=80", caption: customPhrases[6] },
      { src: "https://images.unsplash.com/photo-1534528741775-53994a69daeb?w=500&auto=format&fit=crop&q=80", caption: customPhrases[7] },
      { src: "https://images.unsplash.com/photo-1524504388940-b1c1722653e1?w=500&auto=format&fit=crop&q=80", caption: customPhrases[8] },
      { src: "https://images.unsplash.com/photo-1506794778202-cad84cf45f1d?w=500&auto=format&fit=crop&q=80", caption: customPhrases[9] }
    ];

    let current = 0;

    function updateCarousel() {
      const total = slides.length;
      const prevIdx = (current - 1 + total) % total;
      const nextIdx = (current + 1) % total;

      document.getElementById('imgLeft').src = slides[prevIdx].src;
      document.getElementById('capLeft').textContent = slides[prevIdx].caption;
      document.getElementById('badgeLeft').textContent = `Recuerdo #${prevIdx + 1}`;

      document.getElementById('imgCenter').src = slides[current].src;
      document.getElementById('capCenter').textContent = slides[current].caption;
      document.getElementById('badgeCenter').textContent = `❤️ Recuerdo #${current + 1} ❤️`;

      document.getElementById('imgRight').src = slides[nextIdx].src;
      document.getElementById('capRight').textContent = slides[nextIdx].caption;
      document.getElementById('badgeRight').textContent = `Recuerdo #${nextIdx + 1}`;

      document.getElementById('counterPill').textContent = `${current + 1} / ${total}`;
    }

    function goNext() {
      current = (current + 1) % slides.length;
      updateCarousel();
      burstParticles(w / 2, h / 2, 10);
    }

    function goPrev() {
      current = (current - 1 + slides.length) % slides.length;
      updateCarousel();
      burstParticles(w / 2, h / 2, 10);
    }

    updateCarousel();

    document.getElementById('nextBtn').addEventListener('click', goNext);
    document.getElementById('prevBtn').addEventListener('click', goPrev);
    document.getElementById('cardRight').addEventListener('click', goNext);
    document.getElementById('cardLeft').addEventListener('click', goPrev);

    window.addEventListener('keydown', (e) => {
      if (e.key === 'ArrowRight') goNext();
      if (e.key === 'ArrowLeft') goPrev();
    });

    document.getElementById('editCapBtn').addEventListener('click', () => {
      const newText = prompt("Escribe la dedicatoria para esta foto:", slides[current].caption);
      if (newText !== null && newText.trim() !== "") {
        slides[current].caption = newText.trim();
        updateCarousel();
      }
    });

    document.getElementById('photoInput').addEventListener('change', (e) => {
      const files = Array.from(e.target.files);
      if (files.length > 0) {
        slides = files.map((file, idx) => ({
          src: URL.createObjectURL(file),
          caption: customPhrases[idx % customPhrases.length]
        }));
        current = 0;
        updateCarousel();
        burstParticles(w / 2, h / 2, 25);
      }
    });

    // Carta Secreta
    const letterModal = document.getElementById('letterModal');
    const letterTextEl = document.getElementById('letterText');
    let loveLetterContent = "Desde que llegaste a mi vida, cada día tiene más luz y alegría. Eres mi niño, mi rey y mi mejor aventura. Gracias por cada sonrisa y cada abrazo. ¡Te amo con todo mi corazón! ❤️✨";
    let typeTimer = null;

    function openLetterWithTyping() {
      letterModal.classList.add('open');
      letterTextEl.textContent = '';
      clearInterval(typeTimer);
      let idx = 0;
      typeTimer = setInterval(() => {
        letterTextEl.textContent += loveLetterContent.charAt(idx);
        idx++;
        if (idx >= loveLetterContent.length) clearInterval(typeTimer);
      }, 30);
    }

    document.getElementById('openLetterBtn').addEventListener('click', openLetterWithTyping);
    document.getElementById('closeLetterBtn').addEventListener('click', () => {
      letterModal.classList.remove('open');
      clearInterval(typeTimer);
    });

    document.getElementById('editLetterBtn').addEventListener('click', () => {
      const customLetter = prompt("Escribe tu carta de amor personalizada:", loveLetterContent);
      if (customLetter !== null && customLetter.trim() !== "") {
        loveLetterContent = customLetter.trim();
        openLetterWithTyping();
      }
    });
  </script>
</body>
</html>
