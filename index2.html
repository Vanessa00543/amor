<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title> Galaxia de Amor Infinito ❤️</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      width: 100vw;
      height: 100vh;
      overflow: hidden;
      background-color: #020208;
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
    }

    #canvas-container {
      width: 100%;
      height: 100%;
      position: absolute;
      top: 0;
      left: 0;
    }

    .ui-overlay {
      position: absolute;
      top: 25px;
      left: 50%;
      transform: translateX(-50%);
      text-align: center;
      color: #fff;
      pointer-events: none;
      z-index: 10;
      text-shadow: 0 0 20px rgba(255, 0, 127, 0.9);
    }

    .ui-overlay h1 {
      font-size: 1.6rem;
      font-weight: 300;
      letter-spacing: 4px;
      background: linear-gradient(45deg, #ff758c, #ff7eb3, #ffd700, #00f3ff);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      text-transform: uppercase;
    }

    .ui-overlay p {
      font-size: 0.85rem;
      color: rgba(255, 255, 255, 0.7);
      margin-top: 5px;
    }

    .footer-hint {
      position: absolute;
      bottom: 25px;
      left: 50%;
      transform: translateX(-50%);
      color: rgba(255, 255, 255, 0.4);
      font-size: 0.75rem;
      letter-spacing: 2px;
      text-transform: uppercase;
      pointer-events: none;
      z-index: 10;
    }

    /* Botón de Música */
    .music-control {
      position: absolute;
      bottom: 25px;
      left: 25px;
      background: rgba(255, 255, 255, 0.1);
      border: 1px solid rgba(255, 255, 255, 0.2);
      color: #fff;
      padding: 10px 18px;
      border-radius: 30px;
      cursor: pointer;
      z-index: 20;
      font-size: 0.85rem;
      letter-spacing: 1px;
      backdrop-filter: blur(5px);
      transition: all 0.3s ease;
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .music-control:hover {
      background: rgba(255, 117, 140, 0.3);
      border-color: #ff758c;
      box-shadow: 0 0 15px rgba(255, 117, 140, 0.5);
    }
  </style>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/controls/OrbitControls.js"></script>
</head>
<body>

  <div class="ui-overlay">
    <h1>Mi Universo Eres Tú</h1>
    <p>Un cosmos lleno de amor para ti ✨</p>
  </div>

  <div class="footer-hint">Arrastra para rotar • Rueda para zoom</div>

  <!-- Botón y reproductor de música -->
  <button id="musicBtn" class="music-control">
    <span>🎵</span> <span id="musicText">Reproducir Música</span>
  </button>
   
  <!-- Cambia la URL del src por la canción que desees (ej: un enlace directo a un archivo MP3) -->
  <audio id="bgMusic" loop>
    <source src="asset/@coldplay   Sparks (Lyrics).m4a" type="audio/mpeg">


  <div id="canvas-container"></div>

  <script>
    const container = document.getElementById('canvas-container');
    const scene = new THREE.Scene();
    scene.fog = new THREE.FogExp2(0x020208, 0.001);

    const camera = new THREE.PerspectiveCamera(60, window.innerWidth / window.innerHeight, 0.1, 1000);
    camera.position.set(0, 25, 55);

    const renderer = new THREE.WebGLRenderer({ antialias: true });
    renderer.setSize(window.innerWidth, window.innerHeight);
    renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
    container.appendChild(renderer.domElement);

    const controls = new THREE.OrbitControls(camera, renderer.domElement);
    controls.enableDamping = true;
    controls.dampingFactor = 0.05;
    controls.maxDistance = 140;
    controls.minDistance = 5;

    // --- Control de Música ---
    const musicBtn = document.getElementById('musicBtn');
    const bgMusic = document.getElementById('bgMusic');
    const musicText = document.getElementById('musicText');
    let isPlaying = false;

    musicBtn.addEventListener('click', () => {
      if (!isPlaying) {
        bgMusic.play().then(() => {
          isPlaying = true;
          musicText.textContent = "Pausar Música";
        }).catch(e => console.log("Reproducción bloqueada por el navegador:", e));
      } else {
        bgMusic.pause();
        isPlaying = false;
        musicText.textContent = "Reproducir Música";
      }
    });

    // --- 1. NÚCLEO CENTRAL BRILLANTE ---
    const planetGroup = new THREE.Group();
    const sphereGeo = new THREE.SphereGeometry(3.5, 32, 32);
    const sphereMat = new THREE.MeshBasicMaterial({
      color: 0xff758c,
      wireframe: true,
      transparent: true,
      opacity: 0.7
    });
    const planetMesh = new THREE.Mesh(sphereGeo, sphereMat);
    planetGroup.add(planetMesh);
    scene.add(planetGroup);

    // --- 2. ESPIRAL DE PARTÍCULAS (GALAXIA) ---
    const particleCount = 30000;
    const particleGeo = new THREE.BufferGeometry();
    const positions = new Float32Array(particleCount * 3);
    const colors = new Float32Array(particleCount * 3);

    const colorA = new THREE.Color('#ff758c');
    const colorB = new THREE.Color('#9b59b6');

    for (let i = 0; i < particleCount; i++) {
      const i3 = i * 3;
      const radius = Math.random() * 40 + 4;
      const spinAngle = radius * 0.5;
      const branchAngle = ((i % 4) / 4) * Math.PI * 2;

      positions[i3] = Math.cos(branchAngle + spinAngle) * radius;
      positions[i3 + 1] = (Math.random() - 0.5) * 6;
      positions[i3 + 2] = Math.sin(branchAngle + spinAngle) * radius;

      const mixedColor = colorA.clone().lerp(colorB, radius / 45);
      colors[i3] = mixedColor.r;
      colors[i3 + 1] = mixedColor.g;
      colors[i3 + 2] = mixedColor.b;
    }

    particleGeo.setAttribute('position', new THREE.BufferAttribute(positions, 3));
    particleGeo.setAttribute('color', new THREE.BufferAttribute(colors, 3));

    const particleMat = new THREE.PointsMaterial({
      size: 0.08,
      vertexColors: true,
      blending: THREE.AdditiveBlending,
      transparent: true,
      depthWrite: false
    });

    const galaxyParticles = new THREE.Points(particleGeo, particleMat);
    scene.add(galaxyParticles);

    // --- 3. LLENAR LA GALAXIA DE PALABRAS DE AMOR ---
    const loveWordsPool = [
      "❤️ Mi amor", "👑 Mi rey", "🧸 Mi niño", "✨ Mi vida", 
      "☀️ Mi sol", "💖 Te amo", "🥰 Mi cielo", "💫 Eres todo", 
      "🌹 Mi príncipe", "🔥 Mi hermoso", "⭐ Mi razón", "💕 Te adoro",
      "🍀 Mi suerte", "chiquito mío", "mi pedacito de cielo", "mi lugar favorito",
      "💘 Eres perfecto", "mi hogar", "mi razón de sonreír", "te amo muchísimo",
      "mi mundo entero", "mi ojitos lindos", "mi persona favorita", "por siempre juntos, mi amorcito", "mi corazón late por ti", "mi vida entera eres tú", "mi todo", "mi alegría diaria", "mi felicidad completa", "mi sueño hecho realidad", "mi amor eterno", "mi compañero de vida", "mi refugio seguro", "mi inspiración constante", "mi razón de ser feliz, mi amorcito", "mi sol radiante", "mi estrella brillante", "mi universo completo", "mi alegría infinita", "mi amor incondicional", "mi felicidad absoluta", "mi razón de vivir, mi cielo", "mi mundo lleno de amor, mi vida entera eres tú", "mi corazón late por ti, mi amor eterno", "mi compañero de vida, mi refugio seguro", "mi inspiración constante, mi razón de ser feliz, mi amorcito"
    ];

    const textSprites = [];

    function createTextSprite(message) {
      const canvas = document.createElement('canvas');
      const context = canvas.getContext('2d');
      canvas.width = 512;
      canvas.height = 128;

      context.clearRect(0, 0, canvas.width, canvas.height);
      context.font = 'Bold 32px "Segoe UI", Tahoma, sans-serif';
      context.fillStyle = '#ffffff';
      context.textAlign = 'center';
      context.textBaseline = 'middle';
      
      context.shadowColor = '#ff4757';
      context.shadowBlur = 15;
      context.fillText(message, canvas.width / 2, canvas.height / 2);

      const texture = new THREE.CanvasTexture(canvas);
      const spriteMat = new THREE.SpriteMaterial({ map: texture, transparent: true, blending: THREE.AdditiveBlending });
      const sprite = new THREE.Sprite(spriteMat);
      sprite.scale.set(5.5, 1.4, 1);

      return sprite;
    }

    const totalWords = 80;
    for (let i = 0; i < totalWords; i++) {
      const word = loveWordsPool[Math.floor(Math.random() * loveWordsPool.length)];
      const sprite = createTextSprite(word);
      
      const radius = 5 + Math.random() * 38;
      const angle = Math.random() * Math.PI * 2;
      const height = (Math.random() - 0.5) * 8;

      sprite.position.set(
        Math.cos(angle) * radius,
        height,
        Math.sin(angle) * radius
      );

      scene.add(sprite);
      textSprites.push({ 
        sprite, 
        angle, 
        radius, 
        height, 
        speed: 0.02 + Math.random() * 0.04 
      });
    }

    // --- 4. FONDO DE ESTRELLAS ---
    const starsGeo = new THREE.BufferGeometry();
    const count = 6000;
    const starPos = new Float32Array(count * 3);
    for (let i = 0; i < count * 3; i++) {
      starPos[i] = (Math.random() - 0.5) * 400;
    }
    starsGeo.setAttribute('position', new THREE.BufferAttribute(starPos, 3));
    const starsMat = new THREE.PointsMaterial({ size: 0.06, color: 0xffffff, transparent: true, opacity: 0.5 });
    const starField = new THREE.Points(starsGeo, starsMat);
    scene.add(starField);

    // --- ANIMACIÓN ---
    const clock = new THREE.Clock();

    function animate() {
      requestAnimationFrame(animate);
      const elapsed = clock.getElapsedTime();

      planetMesh.rotation.y = elapsed * 0.3;
      galaxyParticles.rotation.y = elapsed * 0.04;
      starField.rotation.y = elapsed * 0.002;

      textSprites.forEach((item) => {
        const currentAngle = item.angle + elapsed * item.speed;
        item.sprite.position.x = Math.cos(currentAngle) * item.radius;
        item.sprite.position.z = Math.sin(currentAngle) * item.radius;
      });

      controls.update();
      renderer.render(scene, camera);
    }

    animate();

    window.addEventListener('resize', () => {
      camera.aspect = window.innerWidth / window.innerHeight;
      camera.updateProjectionMatrix();
      renderer.setSize(window.innerWidth, window.innerHeight);
    });
  </script>
</body>
</html>
