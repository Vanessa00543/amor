z<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Para Ti, Mi Amor ❤️✨</title>
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Caveat:wght@700&family=Cinzel+Decorative:wght@700&family=Poppins:wght@300;400;600&display=swap');

    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
      user-select: none;
    }

    body {
      width: 100vw;
      height: 100vh;
      overflow: hidden;
      background: radial-gradient(circle at center, #260622 0%, #0f0212 65%, #040008 100%);
      font-family: 'Poppins', sans-serif;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      color: #fff;
      position: relative;
    }

    #fxCanvas {
      position: absolute;
      inset: 0;
      width: 100%;
      height: 100%;
      pointer-events: none;
      z-index: 30;
    }

    /* ==========================================
       NUEVO INICIO: CORAZÓN DE PARTÍCULAS LUMINOSAS
       ========================================== */
    .intro-screen {
      position: relative;
      z-index: 20;
      width: 100%;
      height: 100%;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      text-align: center;
      transition: opacity 0.9s ease, transform 0.9s ease;
    }

    .intro-screen.hidden {
      opacity: 0;
      transform: scale(1.25);
      pointer-events: none;
      position: absolute;
    }

    .intro-top-text {
      font-family: 'Cinzel Decorative', cursive;
      font-size: 1.35rem;
      background: linear-gradient(90deg, #ff9a9e, #ffd700, #ff758c);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      margin-bottom: 10px;
      letter-spacing: 2px;
      text-shadow: 0 0 20px rgba(255, 117, 140, 0.5);
      padding: 0 15px;
    }

    #heartIntroCanvas {
      width: 280px;
      height: 260px;
      cursor: pointer;
      filter: drop-shadow(0 0 20px rgba(255, 60, 120, 0.7));
      transition: transform 0.3s ease;
    }

    #heartIntroCanvas:hover {
      transform: scale(1.06);
    }

    .intro-bottom-hint {
      margin-top: 8px;
      font-size: 0.8rem;
      letter-spacing: 2px;
      text-transform: uppercase;
      color: #ffd1dc;
      animation: glowPulse 2s ease-in-out infinite;
    }

    @keyframes glowPulse {
      0%, 100% { opacity: 0.45; transform: translateY(0); }
      50% { opacity: 1; transform: translateY(-3px); }
    }

    /* ==========================================
       PANTALLA 2: ÁLBUM DE FOTOS Y DEDICATORIAS
       ========================================== */
    .album-experience {
      position: relative;
      z-index: 15;
      width: 100%;
      max-width: 400px;
      height: 100%;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: space-between;
      padding: 14px 12px 18px 12px;
      opacity: 0;
      transform: scale(0.88);
      pointer-events: none;
      transition: all 0.9s cubic-bezier(0.22, 1, 0.36, 1);
    }

    .album-experience.visible {
      opacity: 1;
      transform: scale(1);
      pointer-events: auto;
    }

    .top-bar {
      text-align: center;
    }

    .top-bar h2 {
      font-family: 'Cinzel Decorative', cursive;
      font-size: 1.25rem;
      background: linear-gradient(90deg, #ff9a9e, #ffd700, #ff758c);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
    }

    .love-meter {
      font-size: 0.72rem;
      color: #ffd1dc;
      margin-top: 2px;
      letter-spacing: 0.5px;
    }

    .story-card {
      width: 260px;
      background: linear-gradient(180deg, #fffdf9 0%, #fff0f5 100%);
      border-radius: 16px;
      border: 2px solid #ffd700;
      padding: 12px;
      box-shadow: 
        0 20px 50px rgba(0, 0, 0, 0.8),
        0 0 30px rgba(255, 94, 142, 0.45);
      color: #2b101d;
      text-align: center;
      position: relative;
      transition: transform 0.45s cubic-bezier(0.22, 1, 0.36, 1), opacity 0.3s ease;
      touch-action: pan-y;
    }

    .story-card.flip-out-left {
      transform: translateX(-70px) rotateY(-25deg) scale(0.9);
      opacity: 0;
    }

    .story-card.flip-out-right {
      transform: translateX(70px) rotateY(25deg) scale(0.9);
      opacity: 0;
    }

    .photo-window {
      width: 100%;
      height: 215px;
      border-radius: 10px;
      overflow: hidden;
      position: relative;
      background: #1f0816;
      box-shadow: inset 0 0 12px rgba(0, 0, 0, 0.35);
    }

    .photo-window img {
      width: 100%;
      height: 100%;
      object-fit: cover;
      transition: transform 0.5s ease;
    }

    .photo-window:active img {
      transform: scale(1.05);
    }

    .floating-tag {
      position: absolute;
      top: 8px;
      right: 8px;
      background: rgba(20, 5, 15, 0.72);
      color: #ffd700;
      font-size: 0.68rem;
      padding: 3px 9px;
      border-radius: 12px;
      border: 1px solid rgba(255, 215, 0, 0.5);
      backdrop-filter: blur(4px);
    }

    .dedication-box {
      margin-top: 10px;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 6px;
    }

    .dedication-text {
      font-family: 'Caveat', cursive;
      font-size: 1.35rem;
      color: #521431;
      line-height: 1.1;
    }

    .edit-btn {
      background: rgba(255, 94, 142, 0.15);
      border: none;
      border-radius: 50%;
      width: 22px;
      height: 22px;
      font-size: 0.7rem;
      cursor: pointer;
    }

    .bottom-controls {
      width: 100%;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 10px;
      background: rgba(30, 8, 25, 0.75);
      border: 1px solid rgba(255, 215, 0, 0.35);
      padding: 10px 14px;
      border-radius: 20px;
      backdrop-filter: blur(10px);
    }

    .slider-controls {
      display: flex;
      align-items: center;
      justify-content: space-between;
      width: 100%;
      max-width: 220px;
    }

    .circle-btn {
      width: 34px;
      height: 34px;
      border-radius: 50%;
      border: 1px solid #ffd700;
      background: rgba(255, 94, 142, 0.25);
      color: #fff;
      font-size: 1rem;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      transition: transform 0.2s, background 0.2s;
    }

    .circle-btn:hover {
      background: #ff5e8e;
      transform: scale(1.1);
    }

    .heart-like-btn {
      background: none;
      border: none;
      font-size: 1.45rem;
      cursor: pointer;
      transition: transform 0.2s;
    }

    .heart-like-btn:active {
      transform: scale(1.4);
    }

    .tools-row {
      display: flex;
      gap: 8px;
      justify-content: center;
    }

    .chip-btn {
      background: linear-gradient(135deg, #ff4d79, #ff85a2);
      color: #fff;
      border: none;
      padding: 6px 14px;
      border-radius: 15px;
      font-size: 0.75rem;
      font-weight: 600;
      cursor: pointer;
      box-shadow: 0 3px 10px rgba(255, 77, 121, 0.4);
    }

    input[type="file"] {
      display: none;
    }
  </style>
</head>
<body>

  <canvas id="fxCanvas"></canvas>

  <!-- Única canción de fondo -->
  <audio id="bgMusic" loop>
    <source src="cancion.mp3" type="audio/mpeg">
  </audio>

  <!-- 1. NUEVO INICIO: CORAZÓN DE PARTÍCULAS BRILLANTES -->
  <div class="intro-screen" id="introScreen">
    <div class="intro-top-text">Para el dueño de mi corazón</div>
    <canvas id="heartIntroCanvas" width="280" height="260"></canvas>
    <div class="intro-bottom-hint">✨ Toca el corazón ✨</div>
  </div>

  <!-- 2. INTERIOR DEL ÁLBUM -->
  <div class="album-experience" id="albumExperience">
    <div class="top-bar">
      <h2>Eres Mi Todo ❤️</h2>
      <div class="love-meter" id="loveCounterText">Latidos enviados: 0 💖</div>
    </div>

    <div class="story-card" id="storyCard">
      <div class="photo-window" id="photoWindow">
        <span class="floating-tag" id="pageTag">1 / 4</span>
        <img id="slideImg" src="" alt="Recuerdo">
      </div>
      <div class="dedication-box">
        <span class="dedication-text" id="slideCaption"></span>
        <button class="edit-btn" id="editCaptionBtn" title="Editar mensaje">✏️</button>
      </div>
    </div>

    <div class="bottom-controls">
      <div class="slider-controls">
        <button class="circle-btn" id="prevBtn" title="Anterior">❮</button>
        <button class="heart-like-btn" id="sendLoveBtn" title="Enviar latido">💖</button>
        <button class="circle-btn" id="nextBtn" title="Siguiente">❯</button>
      </div>

      <div class="tools-row">
        <button class="chip-btn" onclick="document.getElementById('photoInput').click()">📸 Subir tus fotos</button>
      </div>
    </div>
  </div>

  <input type="file" id="photoInput" accept="image/*" multiple>

  <script>
    // ==========================================
    // 1. ANIMACIÓN DEL CORAZÓN DE PARTÍCULAS EN EL INICIO
    // ==========================================
    const heartCanvas = document.getElementById('heartIntroCanvas');
    const hCtx = heartCanvas.getContext('2d');
    const heartDots = [];
    const totalDots = 260;

    for (let i = 0; i < totalDots; i++) {
      const t = (Math.PI * 2 * i) / totalDots;
      // Fórmula matemática del corazón
      const hx = 16 * Math.pow(Math.sin(t), 3);
      const hy = -(13 * Math.cos(t) - 5 * Math.cos(2 * t) - 2 * Math.cos(3 * t) - Math.cos(4 * t));
      
      // Relleno interno suave
      const scaleFactor = 0.35 + Math.random() * 0.65;
      heartDots.push({
        baseX: hx * 6.5 * scaleFactor,
        baseY: hy * 6.5 * scaleFactor,
        size: 1.5 + Math.random() * 2.5,
        phase: Math.random() * Math.PI * 2,
        color: Math.random() > 0.3 ? '#ff4d88' : '#ffd700'
      });
    }

    let introActive = true;
    let time = 0;

    function renderIntroHeart() {
      if (!introActive) return;
      time += 0.05;
      hCtx.clearRect(0, 0, heartCanvas.width, heartCanvas.height);

      // Latido rítmico
      const beat = 1 + Math.pow(Math.sin(time * 2.2), 4) * 0.14;
      const centerX = heartCanvas.width / 2;
      const centerY = heartCanvas.height / 2 - 10;

      heartDots.forEach(dot => {
        const px = centerX + dot.baseX * beat + Math.sin(time + dot.phase) * 1.5;
        const py = centerY + dot.baseY * beat + Math.cos(time + dot.phase) * 1.5;
        const alpha = 0.55 + Math.sin(time * 2 + dot.phase) * 0.45;

        hCtx.beginPath();
        hCtx.arc(px, py, dot.size, 0, Math.PI * 2);
        hCtx.fillStyle = dot.color;
        hCtx.globalAlpha = Math.max(0.2, alpha);
        hCtx.fill();
      });

      requestAnimationFrame(renderIntroHeart);
    }
    renderIntroHeart();

    // ==========================================
    // 2. EXPLOSIÓN DE CORAZONES Y TRANSICIÓN
    // ==========================================
    const fxCanvas = document.getElementById('fxCanvas');
    const ctx = fxCanvas.getContext('2d');
    let w = fxCanvas.width = window.innerWidth;
    let h = fxCanvas.height = window.innerHeight;

    window.addEventListener('resize', () => {
      w = fxCanvas.width = window.innerWidth;
      h = fxCanvas.height = window.innerHeight;
    });

    const particles = [];

    function burstParticles(x, y, count = 20) {
      const icons = ['❤️', '💖', '✨', '💕', '🌹'];
      for (let i = 0; i < count; i++) {
        const angle = Math.random() * Math.PI * 2;
        const speed = 1.5 + Math.random() * 5;
        particles.push({
          x, y,
          vx: Math.cos(angle) * speed,
          vy: Math.sin(angle) * speed - 2,
          size: 14 + Math.random() * 12,
          alpha: 1,
          icon: icons[Math.floor(Math.random() * icons.length)]
        });
      }
    }

    function loopFx() {
      ctx.clearRect(0, 0, w, h);
      for (let i = particles.length - 1; i >= 0; i--) {
        const p = particles[i];
        p.x += p.vx;
        p.y += p.vy;
        p.vy += 0.06;
        p.alpha -= 0.015;
        if (p.alpha <= 0) {
          particles.splice(i, 1);
          continue;
        }
        ctx.save();
        ctx.globalAlpha = p.alpha;
        ctx.font = `${p.size}px Arial`;
        ctx.fillText(p.icon, p.x, p.y);
        ctx.restore();
      }
      requestAnimationFrame(loopFx);
    }
    loopFx();

    const introScreen = document.getElementById('introScreen');
    const albumExperience = document.getElementById('albumExperience');
    const bgMusic = document.getElementById('bgMusic');

    heartCanvas.addEventListener('click', (e) => {
      burstParticles(e.clientX || w / 2, e.clientY || h / 2, 45);
      introScreen.classList.add('hidden');
      setTimeout(() => {
        introActive = false;
        albumExperience.classList.add('visible');
      }, 350);

      bgMusic.play().catch(() => {});
    });

    // ==========================================
    // 3. CARRUSEL DE FOTOS Y LATIDOS
    // ==========================================
    const defaultNotes = [
      "Mi niño hermoso, te amo ❤️",
      "Mi rey, mi felicidad entera 👑",
      "Contigo cada día es especial ✨",
      "Eres lo mejor que me ha pasado 💖",
      "Mi persona favorita en el universo 🥰"
    ];

    let pages = [
      { src: "https://images.unsplash.com/photo-1518199266791-5375a83190b7?w=500&auto=format&fit=crop&q=80", note: defaultNotes[0] },
      { src: "https://images.unsplash.com/photo-1516589178581-6cd7833ae3b2?w=500&auto=format&fit=crop&q=80", note: defaultNotes[1] },
      { src: "https://images.unsplash.com/photo-1529333166437-7750a6dd5a70?w=500&auto=format&fit=crop&q=80", note: defaultNotes[2] },
      { src: "https://images.unsplash.com/photo-1494774157365-9e04c6720e47?w=500&auto=format&fit=crop&q=80", note: defaultNotes[3] }
    ];

    let index = 0;
    let loveCount = 0;
    const storyCard = document.getElementById('storyCard');
    const slideImg = document.getElementById('slideImg');
    const slideCaption = document.getElementById('slideCaption');
    const pageTag = document.getElementById('pageTag');
    const loveCounterText = document.getElementById('loveCounterText');

    function showPage(newIndex, dir = 'next') {
      storyCard.classList.add(dir === 'next' ? 'flip-out-left' : 'flip-out-right');
      setTimeout(() => {
        index = (newIndex + pages.length) % pages.length;
        slideImg.src = pages[index].src;
        slideCaption.textContent = pages[index].note;
        pageTag.textContent = `${index + 1} / ${pages.length}`;
        storyCard.classList.remove('flip-out-left', 'flip-out-right');
      }, 220);
    }

    slideImg.src = pages[0].src;
    slideCaption.textContent = pages[0].note;
    pageTag.textContent = `1 / ${pages.length}`;

    document.getElementById('nextBtn').addEventListener('click', () => {
      showPage(index + 1, 'next');
      burstParticles(w / 2, h / 2, 10);
    });

    document.getElementById('prevBtn').addEventListener('click', () => {
      showPage(index - 1, 'prev');
      burstParticles(w / 2, h / 2, 10);
    });

    function sendLove(x, y) {
      loveCount++;
      loveCounterText.textContent = `Latidos enviados: ${loveCount} 💖`;
      burstParticles(x || w / 2, y || h / 2, 18);
    }

    document.getElementById('sendLoveBtn').addEventListener('click', (e) => {
      sendLove(e.clientX, e.clientY);
    });

    document.getElementById('photoWindow').addEventListener('click', (e) => {
      sendLove(e.clientX, e.clientY);
    });

    let startX = 0;
    storyCard.addEventListener('touchstart', (e) => { startX = e.changedTouches[0].screenX; }, { passive: true });
    storyCard.addEventListener('touchend', (e) => {
      const endX = e.changedTouches[0].screenX;
      if (startX - endX > 40) showPage(index + 1, 'next');
      if (endX - startX > 40) showPage(index - 1, 'prev');
    }, { passive: true });

    document.getElementById('editCaptionBtn').addEventListener('click', () => {
      const txt = prompt("Escribe tu dedicatoria para esta foto:", pages[index].note);
      if (txt && txt.trim() !== "") {
        pages[index].note = txt.trim();
        slideCaption.textContent = pages[index].note;
      }
    });

    document.getElementById('photoInput').addEventListener('change', (e) => {
      const files = Array.from(e.target.files);
      if (files.length > 0) {
        pages = files.map((file, i) => ({
          src: URL.createObjectURL(file),
          note: defaultNotes[i % defaultNotes.length]
        }));
        index = 0;
        showPage(0, 'next');
        burstParticles(w / 2, h / 2, 25);
      }
    });
  </script>
</body>
</html>
